<!doctype html><html><head><meta charset="utf-8"><title>AI Trading Bot</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:30px;max-width:900px}pre{padding:16px;background:#f4f4f4;border-radius:8px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #ddd;border-radius:8px;padding:14px}.v{font-size:24px;font-weight:700}</style></head><body><h1>AI Trading Bot</h1><div id="cards" class="grid"></div><h2>Decision reasons</h2><pre id="notes">Loading…</pre><script>async function refresh(){const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();document.getElementById('cards').innerHTML=[['Mode',s.mode],['Symbol',s.symbol||'—'],['Action',s.action||'—'],['Confidence',s.confidence==null?'—':(s.confidence*100).toFixed(1)+'%'],['Regime',s.regime||'—'],['Risk',s.riskApproved?'APPROVED':'REJECTED']].map(x=>`<div class="card"><div>${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');document.getElementById('notes').textContent=(s.notes||[s.message||'No status']).join('\n');}refresh();setInterval(refresh,5000);</script></body></html>
